[package]
name = "evolve-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless evolution simulation core: terrain, plants, creatures, brains, physics"

[dependencies]
rapier3d.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
rmp-serde.workspace = true
zstd.workspace = true
rusqlite.workspace = true
wgpu.workspace = true
half.workspace = true
bytemuck.workspace = true
libc = "0.2"
pprof = { version = "0.14", optional = true }

[features]
# `evolve-headless --profile FILE`: where the CPU time goes, sampled from every thread.
profile = ["dep:pprof"]

[[bin]]
name = "evolve-headless"
path = "src/bin/headless.rs"
