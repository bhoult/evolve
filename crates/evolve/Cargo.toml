[package]
name = "evolve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "3D evolution simulator: creatures with evolved bodies and brains"

[features]
dev = ["bevy/dynamic_linking"]
# Native Wayland windows; needs `sudo apt install libwayland-dev` to build. Without it the app
# runs through XWayland, which works fine.
wayland = ["bevy/wayland"]
# Ray-traced lighting through Bevy Solari (experimental; needs a GPU with hardware ray tracing).
# Built in, it is still off until asked for with `--raytracing`.
raytracing = ["bevy/bevy_solari"]

[dependencies]
evolve-sim.workspace = true
bevy.workspace = true
# Terrain chunks are compared and packed for the GPU in parallel; water travels as half floats.
rayon.workspace = true
half.workspace = true
bytemuck.workspace = true
bevy_egui.workspace = true
# The settings file (settings.rs).
serde.workspace = true
serde_json.workspace = true
egui_plot.workspace = true
# Sound output; the sounds themselves are synthesized in audio.rs.
cpal = "0.15"
