[workspace]
resolver = "3"
members = ["crates/evolve-sim", "crates/evolve"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/bhoult/evolve"

[workspace.dependencies]
evolve-sim = { path = "crates/evolve-sim" }
rapier3d = { version = "0.36", features = ["parallel", "serde-serialize", "profiler"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
rmp-serde = "1.3"
zstd = "0.13"
wgpu = "27"
half = { version = "2", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
bevy = { version = "0.18.1", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "default_font",
    "3d_bevy_render",
    "bevy_picking",
    "mesh_picking",
    "png",
    "experimental_pbr_pcss",
] }
bevy_egui = "0.39.1"
egui_plot = "0.34"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 16
